<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor Local</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#e9edf2;color:#243447}header{background:#204b7a;color:white;padding:15px 25px;display:flex;align-items:center;justify-content:space-between;gap:15px}header input{background:#ffffff20;border:1px solid #ffffff50;color:white;padding:8px;border-radius:5px;font:inherit;width:230px}button,select{font:inherit;border:1px solid #c9d2df;border-radius:5px;background:white;color:#243447;padding:8px;cursor:pointer}button:hover{background:#e5effa}.toolbar{background:#f9fafc;padding:12px 20px;display:flex;flex-wrap:wrap;gap:7px;border-bottom:1px solid #cbd3dd;position:sticky;top:0;z-index:2}.group{display:flex;gap:5px;border-right:1px solid #d9dfe7;padding-right:9px}.paper{background:white;max-width:794px;min-height:1123px;margin:30px auto;padding:75px 80px;box-shadow:0 3px 15px #23354b20;outline:none;font:16px/1.6 Arial;overflow-wrap:anywhere}.paper:empty:before{content:'Comece a escrever seu documento…';color:#a5adb8}.paper table{border-collapse:collapse;width:100%}.paper td{border:1px solid #9aaabd;padding:8px;min-width:60px}.paper img{max-width:100%}.status{padding:10px 20px;background:#f9fafc;position:fixed;bottom:0;left:0;right:0;border-top:1px solid #cbd3dd;font-size:12px;display:flex;justify-content:space-between}dialog{border:0;border-radius:12px;padding:25px;width:min(450px,90vw)}dialog::backdrop{background:#172c4560}dialog input{width:100%;padding:10px;margin:10px 0}body{padding-bottom:45px}@media(max-width:800px){.paper{margin:15px;padding:35px;min-height:800px}header{flex-wrap:wrap}}@media print{header,.toolbar,.status,dialog{display:none!important}body{background:white;padding:0}.paper{margin:0;box-shadow:none;padding:0;max-width:none;min-height:0}@page{size:A4;margin:20mm}}</style><header><strong style="font-size:20px">▤ Editor Local</strong><i const $=s=>document.querySelector(s),ed=$('#editor');let range=null;document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&ed.contains(s.anchorNode))range=s.getRangeAt(0).cloneRange()});function restore(){ed.focus();if(range){const s=getSelection();s.removeAllRanges();s.addRange(range)}}function cmd(c,v){restore();document.execCommand(c,false,v);update()}document.querySelectorAll('[data-cmd]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>cmd(b.dataset.cmd)});$('#block').onchange=e=>cmd('formatBlock',e.target.value);$('#font').onchange=e=>cmd('fontName',e.target.value);$('#size').onchange=e=>cmd('fontSize',e.target.value);$('#color').oninput=e=>cmd('foreColor',e.target.value);let timer;function update(){let t=ed.innerText.trim();$('#count').textContent=(t?t.split(/\s+/).length:0)+' palavras · '+ed.innerText.length+' caracteres';$('#saved').textContent='Alterações pendentes';clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem('editor-local-draft',JSON.stringify({title:$('#title').value,html:ed.innerHTML}));$('#saved').textContent='Rascunho salvo neste navegador'}catch{$('#saved').textContent='Use Salvar arquivo para guardar seu documento'}},500)}ed.addEventListener('input',update);$('#title').oninput=update;function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function filename(){return ($('#title').value.trim()||'Documento').replace(/[\\/:*?"<>|]/g,'_')}$('#save').onclick=()=>{download(filename()+'.json',JSON.stringify({format:'editor-local-v1',title:$('#title').value,html:ed.innerHTML},null,2),'application/json');$('#saved').textContent='Arquivo exportado — confira seus Downloads'};$('#txt').onclick=()=>download(filename()+'.txt',ed.innerText,'text/plain;charset=utf-8');$('#print').onclick=()=>window.print();$('#new').onclick=()=>{if(ed.innerText.trim()&&!confirm('Criar um documento vazio? Salve o arquivo atual antes de continuar.'))return;ed.innerHTML='';$('#title').value='Documento sem título';range=null;update()};$('#open').onclick=()=>$('#file').click();function sanitize(html){const doc=new DOMParser().parseFromString(html,'text/html');const allowed=new Set(['P','BR','DIV','SPAN','B','STRONG','I','EM','U','S','H1','H2','H3','H4','UL','OL','LI','TABLE','TBODY','THEAD','TR','TD','TH','A','IMG','FONT','BLOCKQUOTE']);for(const e of [...doc.body.querySelectorAll('*')]){if(!allowed.has(e.tagName)){e.remove();continue}for(const a of [...e.attributes]){if(!['style','href','src','color','face','size'].includes(a.name))e.removeAttribute(a.name)}if(e.hasAttribute('href')&&!/^(https?:|mailto:)/i.test(e.getAttribute('href')))e.removeAttribute('href');if(e.tagName==='IMG'&&!/^data:image\/(png|jpeg|gif|webp);base64,/i.test(e.getAttribute('src')||''))e.remove();if(e.hasAttribute('style')){const keep=['color','background-color','font-family','font-size','font-weight','font-style','text-decoration','text-align','margin-left'];let st=e.style;for(let i=st.length-1;i>=0;i--){let p=st[i];if(!keep.includes(p)||/url\s*\(/i.test(st.getPropertyValue(p)))st.removeProperty(p)}}}return doc.body.innerHTML}$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(ed.innerText.trim()&&!confirm('Substituir o documento atual? Salve antes se quiser mantê-lo.'))return;try{let text=await f.text();if(f.name.toLowerCase().endsWith('.txt')){ed.innerText=text;$('#title').value=f.name.replace(/\.txt$/i,'')}else{const d=JSON.parse(text);if(d.format!=='editor-local-v1'||typeof d.html!=='string')throw Error();ed.innerHTML=sanitize(d.html);$('#title').value=d.title||'Documento'}range=null;update()}catch{alert('Não foi possível abrir. Use um TXT ou JSON salvo por este editor.')}finally{e.target.value=''}};$('#link').onclick=()=>{let url=prompt('Endereço do link (https://…)');if(!url)return;if(!/^https?:\/\//i.test(url)){alert('Use um endereço iniciado por http:// ou https://');return}cmd('createLink',url)};$('#table').onclick=()=>{let input=prompt('Linhas e colunas, por exemplo: 3x3','3x3');if(!input)return;let m=input.match(/^(\d+)\s*x\s*(\d+)$/i);if(!m||+m[1]<1||+m[1]>20||+m[2]<1||+m[2]>10){alert('Use entre 1 e 20 linhas e entre 1 e 10 colunas.');return}cmd('insertHTML','<table><tbody>'+Array.from({length:+m[1]},()=>'<tr>'+Array.from({length:+m[2]},()=>'<td><br></td>').join('')+'</tr>').join('')+'</tbody></table><p><br></p>')};$('#image').onclick=()=>$('#picture').click();$('#picture').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){alert('Escolha uma imagem de até 5 MB.');return}const r=new FileReader();r.onload=()=>cmd('insertImage',r.result);r.readAsDataURL(f);e.target.value=''};ed.addEventListener('paste',e=>{e.preventDefault();cmd('insertText',e.clipboardData.getData('text/plain'))});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('#save').click()}});try{const d=JSON.parse(localStorage.getItem('editor-local-draft'));if(d){ed.innerHTML=sanitize(d.html);$('#title').value=d.title||'Documento sem título'}}catch{}update();
